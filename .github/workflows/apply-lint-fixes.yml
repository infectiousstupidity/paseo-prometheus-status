name: Diagnose lint

on:
  push:
    branches: [paseo-0.8-migration]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: paseo-0.8-migration

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print lint diagnostics
        run: npx oxlint . --format json || true
