name: Apply final migration fixes

on:
  push:
    branches: [paseo-0.8-migration]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: paseo-0.8-migration

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = -1):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, count))

          replace(
              "client/gpu-alert.tsx",
              "if (!agent.workspaceId || isStopped) {",
              "if (isStopped || !agent.workspaceId) {",
          )

          replace(
              "server/status-core.ts",
              "normalizePrometheusBaseUrl(prometheusUrl).toString(),",
              "normalizePrometheusBaseUrl(prometheusUrl).href,",
          )

          replace(
              "server/status.ts",
              "process.env.PASEO_HOME?.trim() || join(homedir(), \".paseo\")",
              "(process.env.PASEO_HOME || \"\").trim() || join(homedir(), \".paseo\")",
          )
          replace("server/status.ts", "nonNegative", "isNonNegative")
          replace("server/status.ts", "activeEnvOverrides", "activeEnvironmentOverrides")
          replace(
              "server/status.ts",
              "  env: Readonly<Record<string, string | undefined>> = process.env,",
              "  environment: Readonly<Record<string, string | undefined>> = process.env,",
          )
          replace("server/status.ts", "env.", "environment.")
          replace("server/status.ts", "env[name]", "environment[name]")
          replace(
              "server/status.ts",
              "const gpus = [...gpusByKey.values()].sort(",
              "const gpus = [...gpusByKey.values()].toSorted(",
          )
          replace(
              "server/status.ts",
              "  const generation = cacheGeneration;\n  const request = collect().then(({ status, sourceFingerprint }) => {\n    if (generation === cacheGeneration) {\n      cachedStatus = status;\n      cachedSourceFingerprint = sourceFingerprint;\n      cachedAt = Date.now();\n    }\n    return status;\n  });",
              "  const generation = cacheGeneration;\n  const request = (async () => {\n    const { status, sourceFingerprint } = await collect();\n    if (generation === cacheGeneration) {\n      cachedStatus = status;\n      cachedSourceFingerprint = sourceFingerprint;\n      cachedAt = Date.now();\n    }\n    return status;\n  })();",
          )

          replace("client/status.tsx", "isNeedsConfiguration", "requiresConfig")
          replace(
              "client/status.tsx",
              "  const statusMessage = requiresConfig",
              "  const canShowStatus = !requiresConfig;\n  const hasGpus = (status?.gpus.length ?? 0) > 0;\n  const statusMessage = requiresConfig",
          )
          replace(
              "client/status.tsx",
              "        {!requiresConfig && (status?.gpus.length ?? 0) > 0 ? (",
              "        {canShowStatus && hasGpus && (",
          )
          replace(
              "client/status.tsx",
              "        ) : !requiresConfig ? (",
              "        )}\n\n        {canShowStatus && !hasGpus && (",
          )
          replace(
              "client/status.tsx",
              "          </View>\n        ) : null}\n      </View>\n    </ScrollView>",
              "          </View>\n        )}\n      </View>\n    </ScrollView>",
          )

          replace(
              "index.server.ts",
              "export default function contribute(server: PluginServerContext) {\n  server.handle(gpuStatusGet, getGpuStatus);\n  server.handle(gpuStatusConfigGet, () => describeGpuStatusConfig());",
              "function getGpuStatusConfig() {\n  return describeGpuStatusConfig();\n}\n\nexport default function contribute(server: PluginServerContext) {\n  server.handle(gpuStatusGet, getGpuStatus);\n  server.handle(gpuStatusConfigGet, getGpuStatusConfig);",
          )

          replace(
              "oxlint.config.mts",
              '    "unicorn-js/prefer-https": "off",',
              '    "unicorn-js/prefer-https": "off",\n    // The server intentionally keeps a small module-level request/status cache.\n    "unicorn-js/no-top-level-assignment-in-function": "off",\n    // Named node:path imports keep the filesystem helpers explicit at call sites.\n    "unicorn-js/import-style": "off",\n    // Iterator#toArray is newer than this plugin\'s ES2023 type target.\n    "unicorn-js/prefer-iterator-to-array": "off",',
          )

          replace(
              "tsconfig.test.json",
              '"status.core.ts"',
              '"server/status-core.ts"',
          )
          PY

          npm run format

      - name: Verify migration
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy Paseo 0.8 migration checks"
          git push
